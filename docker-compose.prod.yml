services:
  web:
    build:
      context: .
    networks:
      - proxy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.shareindia.rule=Host(`shareindia.internal.wabisabitech.in`)'
      - 'traefik.http.routers.shareindia.entrypoints=https'
      - 'traefik.http.routers.shareindia.tls=true'
      - 'traefik.http.services.shareindia.loadbalancer.server.port=3000'
    restart: unless-stopped
    container_name: share-india-website
    environment:
      - NODE_ENV=production
      - PORT=3000

networks:
  proxy:
    external: true
