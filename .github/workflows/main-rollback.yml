name: Emergency Rollback

on:
  workflow_run:
    workflows: ['Production Deployment']
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual rollback'
        required: true
        default: 'Manual rollback requested'

env:
  DEPLOYMENT_PATH: /home/ubuntu/projects/wabisabi/Share-India-Website

jobs:
  rollback:
    name: Execute Emergency Rollback
    runs-on: ubuntu-latest
    if: |
      (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.name == 'Production Deployment') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Configure SSH for rollback
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Execute emergency rollback procedure
        run: |
          ssh ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << 'ROLLBACK_SCRIPT'
            set -euo pipefail
            
            DEPLOY_PATH="${{ env.DEPLOYMENT_PATH }}"
            TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
            LOG_FILE="${DEPLOY_PATH}/logs/rollback_${TIMESTAMP}.log"
            
            # Setup rollback logging
            mkdir -p "${DEPLOY_PATH}/logs"
            exec 1> >(tee -a "${LOG_FILE}")
            exec 2>&1
            
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] 🚨 INITIATING EMERGENCY ROLLBACK"
            echo "Deployment ID: ${{ github.run_id }}"
            echo "Trigger: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reason || 'Deployment failure detected' }}"
            
            cd "${DEPLOY_PATH}"
            
            # Try to restore previous git state
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Attempting to restore previous state"
            
            # Check if there's a stash to restore
            if git stash list | grep -q "Auto-stash before deployment"; then
              echo "Found auto-stash, attempting to restore"
              git reset --hard HEAD~1 || echo "Could not reset to previous commit"
              git stash pop || echo "Could not restore stashed changes"
            else
              echo "No auto-stash found, trying to revert to previous commit"
              git reset --hard HEAD~1 || echo "Could not reset to previous commit"
            fi
            
            # Rebuild and restart with previous code
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Rebuilding containers with rollback code"
            
            sudo docker compose -f docker-compose.prod.yml down --remove-orphans || true
            sleep 5
            
            if sudo docker compose -f docker-compose.prod.yml build --no-cache; then
              if sudo docker compose -f docker-compose.prod.yml up -d; then
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] ✅ Rollback deployment successful"
                
                # Wait and verify
                sleep 20
                sudo docker compose -f docker-compose.prod.yml ps
                
                # Test service if possible
                if command -v curl >/dev/null 2>&1; then
                  if curl -f -s -m 10 https://shareindia.internal.wabisabitech.in/api/health >/dev/null 2>&1 || \
                     curl -f -s -m 10 https://shareindia.internal.wabisabitech.in >/dev/null 2>&1; then
                    echo "✅ Rollback service is responding"
                  else
                    echo "⚠️  Rollback service connectivity check failed"
                  fi
                fi
              else
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] ❌ Rollback deployment failed"
              fi
            else
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] ❌ Rollback build failed"
            fi
            
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Rollback procedure completed"
          ROLLBACK_SCRIPT
