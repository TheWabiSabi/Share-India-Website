name: Production Deployment

on:
  workflow_run:
    workflows: ["Quality Assurance Pipeline"]
    types:
      - completed
    branches:
      - main

env:
  DEPLOYMENT_PATH: /home/ubuntu/projects/wabisabi/Share-India-Website

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Configure SSH authentication
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Validate server connectivity
        run: |
          ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

          # Test SSH connection
          ssh -o ConnectTimeout=10 -o BatchMode=yes \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} \
            'echo "SSH connection established successfully"'

      - name: Execute deployment workflow
        id: deploy
        run: |
          ssh ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << 'DEPLOYMENT_SCRIPT'
            set -euo pipefail
            
            DEPLOY_PATH="${{ env.DEPLOYMENT_PATH }}"
            TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
            LOG_FILE="${DEPLOY_PATH}/logs/deployment_${TIMESTAMP}.log"
            
            # Create logs directory if it doesn't exist
            mkdir -p "${DEPLOY_PATH}/logs"
            
            # Setup comprehensive logging
            exec 1> >(tee -a "${LOG_FILE}")
            exec 2>&1
            
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Starting production deployment"
            echo "Deployment ID: ${{ github.run_id }}"
            echo "Commit SHA: ${{ github.sha }}"
            echo "Triggered by: ${{ github.actor }}"
            
            # Navigate to project directory
            cd "${DEPLOY_PATH}"
            
            # Verify we're in the correct directory
            if [[ ! -f "docker-compose.prod.yml" ]]; then
              echo "ERROR: docker-compose.prod.yml not found in ${DEPLOY_PATH}"
              echo "Current directory contents:"
              ls -la
              exit 1
            fi
            
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Project directory verified"
            
            # Step 1: Git pull (equivalent to your manual step)
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Pulling latest changes from repository"
            
            # Backup current state before pulling
            CURRENT_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
            echo "Current commit: ${CURRENT_COMMIT}"
            
            # Stash any local changes and pull
            git stash push -m "Auto-stash before deployment ${TIMESTAMP}" || true
            
            if ! git pull origin main; then
              echo "ERROR: Failed to pull latest changes"
              exit 1
            fi
            
            NEW_COMMIT=$(git rev-parse HEAD)
            echo "Updated to commit: ${NEW_COMMIT}"
            
            if [[ "${CURRENT_COMMIT}" == "${NEW_COMMIT}" ]]; then
              echo "No new changes detected, but proceeding with deployment"
            else
              echo "Changes detected, proceeding with deployment"
              git log --oneline "${CURRENT_COMMIT}..${NEW_COMMIT}" || true
            fi
            
            # Step 2: Create backup of current running containers
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Creating deployment backup"
            
            if sudo docker compose -f docker-compose.prod.yml ps -q | grep -q .; then
              # Backup current container state
              sudo docker compose -f docker-compose.prod.yml ps --format "json" > "logs/containers_backup_${TIMESTAMP}.json" || true
              
              # Save current images
              sudo docker compose -f docker-compose.prod.yml images --format "json" > "logs/images_backup_${TIMESTAMP}.json" || true
              
              echo "Backup created successfully"
            else
              echo "No running containers found, skipping backup"
            fi
            
            # Step 3: Build containers (equivalent to your manual step)
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Building Docker containers"
            
            # Build with no cache to ensure fresh build
            if ! sudo docker compose -f docker-compose.prod.yml build; then
              echo "ERROR: Docker build failed"
              echo "Build logs:"
              sudo docker compose -f docker-compose.prod.yml logs || true
              exit 1
            fi
            
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Docker build completed successfully"
            
            # Step 4: Deploy containers (equivalent to your manual step)
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Deploying containers with zero-downtime strategy"
            
            # Deploy with recreate to ensure latest images are used
            if ! sudo docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans; then
              echo "ERROR: Container deployment failed"
              
              # Show container status for debugging
              echo "Container status:"
              sudo docker compose -f docker-compose.prod.yml ps || true
              
              # Show recent logs
              echo "Recent container logs:"
              sudo docker compose -f docker-compose.prod.yml logs --tail=50 || true
              
              exit 1
            fi
            
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Containers deployed successfully"
            
            # Step 5: Wait for services to stabilize
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Waiting for services to stabilize"
            sleep 20
            
            # Step 6: Verify deployment health
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Performing deployment verification"
            
            # Check container status
            FAILED_CONTAINERS=$(sudo docker compose -f docker-compose.prod.yml ps --filter "status=exited" -q)
            if [[ -n "${FAILED_CONTAINERS}" ]]; then
              echo "ERROR: Some containers failed to start:"
              sudo docker compose -f docker-compose.prod.yml ps
              
              echo "Failed container logs:"
              for container in ${FAILED_CONTAINERS}; do
                echo "=== Logs for container ${container} ==="
                sudo docker logs "${container}" --tail=100 || true
              done
              
              exit 1
            fi
            
            # Show current deployment status
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Current deployment status:"
            sudo docker compose -f docker-compose.prod.yml ps
            
            # Check if services are responding (if health check endpoint exists)
            if command -v curl >/dev/null 2>&1; then
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] Testing service connectivity"
              
              # Try to connect to service (adjust port as needed)
              HEALTH_CHECK_ATTEMPTS=0
              MAX_ATTEMPTS=12
              
              while [ ${HEALTH_CHECK_ATTEMPTS} -lt ${MAX_ATTEMPTS} ]; do
                if curl -f -s -m 5 https://shareindia.internal.wabisabitech.in/api/health >/dev/null 2>&1 || \
                   curl -f -s -m 5 https://shareindia.internal.wabisabitech.in >/dev/null 2>&1; then
                  echo "✅ Service is responding"
                  break
                else
                  HEALTH_CHECK_ATTEMPTS=$((HEALTH_CHECK_ATTEMPTS + 1))
                  if [ ${HEALTH_CHECK_ATTEMPTS} -eq ${MAX_ATTEMPTS} ]; then
                    echo "⚠️  Service health check failed, but containers are running"
                    echo "This might be normal if the service takes time to start or doesn't have a health endpoint"
                  else
                    echo "Health check attempt ${HEALTH_CHECK_ATTEMPTS}/${MAX_ATTEMPTS} failed, retrying in 10s"
                    sleep 10
                  fi
                fi
              done
            fi
            
            # Step 7: Cleanup old resources
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Cleaning up unused resources"
            
            # Remove dangling images
            sudo docker image prune -f || echo "Warning: Image cleanup failed"
            
            # Remove old containers
            sudo docker container prune -f || echo "Warning: Container cleanup failed"
            
            # Show disk usage
            echo "Current Docker disk usage:"
            sudo docker system df || true
            
            # Cleanup old logs (keep last 30 days)
            find logs/ -name "*.log" -type f -mtime +30 -delete 2>/dev/null || true
            find logs/ -name "*backup*" -type f -mtime +7 -delete 2>/dev/null || true
            
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] ✅ Production deployment completed successfully"
            echo "Deployment summary:"
            echo "- Previous commit: ${CURRENT_COMMIT}"
            echo "- Current commit: ${NEW_COMMIT}"
            echo "- Services deployed: $(sudo docker compose -f docker-compose.prod.yml ps --services | wc -l)"
            echo "- Deployment time: ${TIMESTAMP}"
            
            # Final status check
            echo "Final container status:"
            sudo docker compose -f docker-compose.prod.yml ps
          DEPLOYMENT_SCRIPT

    outputs:
      deployment_status: ${{ steps.deploy.outcome }}
      deployment_id: ${{ github.run_id }}
