name: Lint

on:
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # or whatever version you're using

      - name: Install dependencies
        run: npm ci # or yarn install / pnpm install

      - name: Run ESLint
        run: npm run lint
      
      - name: Run Prettier
        run: npx prettier --check .
    