name: Deployment Notifications

on:
  workflow_run:
    workflows:
      - 'Production Deployment'
      - 'Emergency Rollback'
    types:
      - completed

jobs:
  notify-deployment:
    name: Send Deployment Notifications
    runs-on: ubuntu-latest
    if: github.event.workflow_run.name == 'Production Deployment'

    steps:
      - name: Send success notification
        if: github.event.workflow_run.conclusion == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '✅ Production Deployment Successful - ${{ github.repository }}'
          body: |
            Production deployment completed successfully!

            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.event.workflow_run.head_branch }}
            **Commit:** ${{ github.event.workflow_run.head_sha }}
            **Author:** ${{ github.actor }}
            **Deployment ID:** ${{ github.event.workflow_run.id }}
            **Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

            The application has been deployed using your standard workflow:
            1. ✅ SSH connection established
            2. ✅ Git pull completed
            3. ✅ Docker build successful
            4. ✅ Containers deployed and running

            View logs: ${{ github.event.workflow_run.html_url }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.SMTP_FROM_EMAIL }}

      - name: Send failure notification
        if: github.event.workflow_run.conclusion == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '🚨 URGENT: Production Deployment Failed - ${{ github.repository }}'
          body: |
            🚨 Production deployment has failed!

            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.event.workflow_run.head_branch }}
            **Commit:** ${{ github.event.workflow_run.head_sha }}
            **Author:** ${{ github.actor }}
            **Deployment ID:** ${{ github.event.workflow_run.id }}
            **Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

            **Status:** Deployment failed - Emergency rollback may have been triggered

            **Immediate Actions:**
            1. Check deployment logs immediately
            2. SSH into server to verify application status
            3. Verify rollback was successful

            View detailed logs: ${{ github.event.workflow_run.html_url }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.SMTP_FROM_EMAIL }}

      - name: Discord deployment notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ github.event.workflow_run.conclusion == 'success' && 'success' || 'failure' }}
          title: "Production Deployment ${{ github.event.workflow_run.conclusion == 'success' && 'Successful' || 'Failed' }}"
          description: |
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.event.workflow_run.head_branch }}
            **Commit:** `${{ github.event.workflow_run.head_sha }}`
            **Author:** ${{ github.actor }}

            ${{ github.event.workflow_run.conclusion == 'success' && '✅ All deployment steps completed successfully!' || '🚨 Deployment failed - Check logs immediately!' }}

            [View Deployment Logs](${{ github.event.workflow_run.html_url }})
          color: ${{ github.event.workflow_run.conclusion == 'success' && '0x00ff00' || '0xff0000' }}
          username: 'GitHub Actions'
          avatar_url: 'https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png'

    outputs:
      deployment_status: ${{ github.event.workflow_run.conclusion }}
      workflow_name: ${{ github.event.workflow_run.name }}

  notify-rollback:
    name: Send Rollback Notifications
    runs-on: ubuntu-latest
    # ✅ KEY CHANGES: Only run if deployment failed AND after deployment notifications complete
    needs: notify-deployment
    if: |
      github.event.workflow_run.name == 'Emergency Rollback' ||
      (needs.notify-deployment.outputs.deployment_status == 'failure' && 
       needs.notify-deployment.outputs.workflow_name == 'Production Deployment')

    steps:
      - name: Send rollback notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "🔄 Emergency Rollback ${{ github.event.workflow_run.conclusion == 'success' && 'Completed' || 'Failed' }} - ${{ github.repository }}"
          body: |
            Emergency rollback procedure ${{ github.event.workflow_run.conclusion == 'success' && 'completed successfully' || 'failed' }}!

            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.event.workflow_run.head_branch }}
            **Rollback Status:** ${{ github.event.workflow_run.conclusion }}
            **Rollback ID:** ${{ github.event.workflow_run.id }}
            **Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

            ${{ github.event.workflow_run.conclusion == 'success' && 'The application has been rolled back to the previous stable version.' || 'CRITICAL: Rollback failed! Manual intervention required immediately.' }}

            View rollback logs: ${{ github.event.workflow_run.html_url }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.SMTP_FROM_EMAIL }}

      - name: Discord rollback notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ github.event.workflow_run.conclusion }}
          title: "Emergency Rollback ${{ github.event.workflow_run.conclusion == 'success' && 'Successful' || 'FAILED' }}"
          description: |
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.event.workflow_run.head_branch }}
            **Status:** ${{ github.event.workflow_run.conclusion }}

            ${{ github.event.workflow_run.conclusion == 'success' && '🔄 Emergency rollback completed successfully. Application restored to previous stable version.' || '🚨 CRITICAL: Emergency rollback failed! Manual intervention required immediately!' }}

            [View Rollback Logs](${{ github.event.workflow_run.html_url }})
          color: ${{ github.event.workflow_run.conclusion == 'success' && '0xffa500' || '0xff0000' }}
          username: 'GitHub Actions - Emergency'
          avatar_url: 'https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png'
